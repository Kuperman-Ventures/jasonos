<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marketing Professor Roadmap</title>
<meta name="description" content="Personal operating system for mapping the path to becoming a college professor of marketing, with Seton Hall as the primary target." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f4f5f7;--bg-elevated:#fff;--bg-subtle:#eef0f3;--bg-hover:#e8ebef;
  --border:#d8dde5;--border-strong:#c2c9d4;--text:#15202b;--text-secondary:#4a5568;--text-muted:#6b7280;
  --accent:#0f5c6e;--accent-hover:#0c4a59;--accent-soft:rgba(15,92,110,.10);--accent-contrast:#fff;
  --success:#1f7a4d;--success-soft:rgba(31,122,77,.12);--warning:#9a6700;--warning-soft:rgba(154,103,0,.12);
  --danger:#b42318;--danger-soft:rgba(180,35,24,.10);--info:#175cd3;--info-soft:rgba(23,92,211,.10);
  --shadow-sm:0 1px 2px rgba(16,24,40,.04);--shadow-md:0 4px 12px rgba(16,24,40,.06);
  --radius:8px;--radius-sm:6px;--sidebar-w:232px;--header-h:56px;
  --font:"IBM Plex Sans","Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --focus:0 0 0 2px var(--bg-elevated),0 0 0 4px var(--accent);
}
[data-theme="dark"]{
  --bg:#0f1419;--bg-elevated:#171d25;--bg-subtle:#1e2630;--bg-hover:#253040;
  --border:#2a3441;--border-strong:#3a4656;--text:#e8edf4;--text-secondary:#b4becb;--text-muted:#8793a3;
  --accent:#3d9fb0;--accent-hover:#57b4c4;--accent-soft:rgba(61,159,176,.16);--accent-contrast:#0a1216;
  --success:#3dd68c;--success-soft:rgba(61,214,140,.14);--warning:#f0b429;--warning-soft:rgba(240,180,41,.14);
  --danger:#f97066;--danger-soft:rgba(249,112,102,.14);--info:#84adff;--info-soft:rgba(132,173,255,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);--shadow-md:0 4px 16px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:none;box-shadow:var(--focus)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;height:100dvh}
.sidebar{background:var(--bg-elevated);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:40}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--border);min-height:var(--header-h)}
.brand-mark{width:28px;height:28px;flex-shrink:0}
.brand-title{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--text-muted);margin-top:1px}
.nav{padding:10px 8px;overflow-y:auto;flex:1;min-height:0}
.nav-section-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding:8px 8px 4px}
.nav-btn{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text-secondary);padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;text-align:left;transition:background .12s,color .12s}
.nav-btn:hover{background:var(--bg-hover);color:var(--text)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn svg{width:15px;height:15px;flex-shrink:0}
.nav-meta{margin-left:auto;font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.sidebar-foot{border-top:1px solid var(--border);padding:10px 12px;font-size:11px;color:var(--text-muted)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:var(--header-h);flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border)}
.menu-toggle{display:none;border:1px solid var(--border);background:var(--bg-elevated);border-radius:var(--radius-sm);width:32px;height:32px;align-items:center;justify-content:center;cursor:pointer}
.page-heading{min-width:0;flex:1}
.page-title{font-size:14px;font-weight:650;letter-spacing:-.015em}
.page-crumb{font-size:11px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.school-select{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);border-radius:var(--radius-sm);padding:4px 8px;height:32px}
.school-select label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
.school-select select{border:0;background:transparent;font-weight:550;max-width:140px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:16px;min-height:0}
.content-inner{max-width:1180px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--bg-hover)}.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent}.btn-sm{height:28px;padding:0 8px;font-size:12px}.btn-icon{width:32px;padding:0}.btn svg{width:14px;height:14px}
.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--bg-elevated);border-radius:var(--radius-sm);padding:7px 9px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{min-height:72px;resize:vertical}
.label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px}
.field{margin-bottom:10px}
.field-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid{display:grid;gap:12px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
.span-2{grid-column:span 2}.span-3{grid-column:span 3}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.card-title{font-size:12.5px;font-weight:650;letter-spacing:-.01em}
.card-b{padding:12px}.card-muted{color:var(--text-secondary);font-size:12px}
.stat{padding:12px}.stat-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.stat-value{margin-top:4px;font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-sub{margin-top:2px;font-size:11px;color:var(--text-muted)}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--bg-subtle);color:var(--text-secondary);white-space:nowrap}
.pill-accent{background:var(--accent-soft);color:var(--accent)}.pill-success{background:var(--success-soft);color:var(--success)}
.pill-warning{background:var(--warning-soft);color:var(--warning)}.pill-danger{background:var(--danger-soft);color:var(--danger)}.pill-info{background:var(--info-soft);color:var(--info)}
.progress{height:6px;background:var(--bg-subtle);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.progress-row{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin-bottom:8px;font-size:12px}
.progress-row .pct{text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:11px}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:flex-start;gap:8px;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.list-item:hover{border-color:var(--border-strong)}
.check{width:15px;height:15px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.list-body{flex:1;min-width:0}.list-title{font-weight:550}.list-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.data th{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);background:var(--bg-subtle)}
table.data tr:last-child td{border-bottom:0}table.data tbody tr:hover td{background:var(--bg-hover)}
.editable{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 4px;width:100%}
.editable:hover{border-color:var(--border);background:var(--bg)}
.editable:focus{border-color:var(--accent);background:var(--bg-elevated);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.accordion{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg-elevated)}
.acc-item+.acc-item{border-top:1px solid var(--border)}
.acc-trigger{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;background:transparent;border:0;cursor:pointer;text-align:left}
.acc-trigger:hover{background:var(--bg-hover)}
.acc-chevron{width:14px;height:14px;transition:transform .15s;color:var(--text-muted);flex-shrink:0}
.acc-item.open .acc-chevron{transform:rotate(90deg)}
.acc-panel{display:none;padding:0 12px 12px}.acc-item.open .acc-panel{display:block;border-top:1px solid var(--border);padding-top:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
.search{position:relative;min-width:200px;flex:1;max-width:320px}
.search input{padding-left:28px;height:32px}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted);pointer-events:none}
.empty{text-align:center;padding:28px 16px;color:var(--text-muted);border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--bg)}
.empty strong{display:block;color:var(--text-secondary);margin-bottom:4px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 14px 12px}.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-15px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg-elevated);border:2px solid var(--border-strong)}
.tl-item.done .tl-dot{border-color:var(--success);background:var(--success)}
.tl-item.active .tl-dot{border-color:var(--accent);background:var(--accent)}
.tl-phase{font-weight:650;font-size:12.5px}.tl-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.tl-milestones{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.gap-row{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 90px 1.2fr;gap:8px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);align-items:start}
.gap-row .mini-label{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:3px}
.note-card.pinned{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--bg-subtle);color:var(--text-secondary);border:1px solid var(--border)}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,16,24,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-backdrop.open{display:flex}
.modal{width:min(480px,100%);background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);max-height:min(90vh,720px);overflow:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.modal-b{padding:14px}.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg-elevated);padding:10px 12px;border-radius:var(--radius-sm);font-size:12px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:120;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(10,16,24,.4);z-index:35}
.drawer-backdrop.open{display:block}
.section-intro{margin-bottom:12px;color:var(--text-secondary);max-width:720px}
/* Macro progress track — omnipresent, visually quiet */
.macro-track{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.macro-track-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.macro-track-label{font-size:10px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.macro-track-meta{font-size:11px;color:var(--text-muted)}
.macro-steps{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:2px}
.macro-step{flex:1 1 0;min-width:88px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px;background:transparent;border:0;cursor:default;color:var(--text-muted)}
.macro-step.clickable{cursor:pointer}
.macro-step.clickable:hover .macro-step-name{color:var(--text)}
.macro-step-rail{display:flex;align-items:center;width:100%;margin-bottom:6px}
.macro-step-rail::before,.macro-step-rail::after{content:"";flex:1;height:2px;background:var(--border)}
.macro-step:first-child .macro-step-rail::before,.macro-step:last-child .macro-step-rail::after{background:transparent}
.macro-step-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;z-index:1}
.macro-step.completed .macro-step-dot{border-color:var(--success);background:var(--success);color:#fff}
.macro-step.completed .macro-step-rail::before,.macro-step.completed .macro-step-rail::after{background:var(--success)}
.macro-step.active .macro-step-dot{border-color:var(--info);background:var(--info);color:#fff;box-shadow:0 0 0 3px var(--info-soft)}
.macro-step.active .macro-step-rail::before{background:var(--success)}
.macro-step.active .macro-step-name{color:var(--text);font-weight:700}
.macro-step-name{font-size:11px;line-height:1.25;color:var(--text-secondary);max-width:100%}
.macro-step-status{font-size:10px;margin-top:3px;font-weight:600;letter-spacing:.02em}
.macro-step.completed .macro-step-status{color:var(--success)}
.macro-step.active .macro-step-status{color:var(--info)}
.macro-step.pending .macro-step-status{color:var(--text-muted)}
/* Micro action zone — last / current / next */
.micro-zone{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.micro-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-elevated);padding:12px 14px}
.micro-card.anchor,.micro-card.foresight{background:var(--bg-subtle);border-color:var(--border);opacity:.92;box-shadow:none}
.micro-card.focus{border-color:var(--info);box-shadow:0 0 0 1px var(--info-soft),var(--shadow-md);background:var(--bg-elevated);padding:16px}
.micro-kicker{font-size:11px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.micro-card.anchor .micro-kicker{color:var(--success)}
.micro-card.focus .micro-kicker{color:var(--info)}
.micro-card.foresight .micro-kicker{color:var(--text-muted)}
.micro-title{font-size:14px;font-weight:650;letter-spacing:-.015em;color:var(--text)}
.micro-card.anchor .micro-title,.micro-card.foresight .micro-title{font-size:13px;font-weight:550;color:var(--text-secondary)}
.micro-meta{font-size:11px;color:var(--text-muted);margin-top:3px}
.micro-body{margin-top:12px}
.micro-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.micro-checklist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.micro-empty{font-size:12px;color:var(--text-muted);font-style:italic}
.secondary-panel{margin-top:4px}
.secondary-panel-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--border-strong);background:transparent;border-radius:var(--radius);padding:8px 12px;cursor:pointer;color:var(--text-secondary);font-size:12px;font-weight:550}
.secondary-panel-toggle:hover{background:var(--bg-hover);color:var(--text)}
.secondary-panel-body{display:none;margin-top:12px}
.secondary-panel.open .secondary-panel-body{display:block}
.kv{display:grid;gap:8px}.kv-row{display:grid;grid-template-columns:140px 1fr;gap:8px;font-size:12px}.kv-row dt{color:var(--text-muted);font-weight:550}
.prose-list{margin:0;padding-left:16px}.prose-list li{margin-bottom:4px}
.decision-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.option-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;background:var(--bg);font-size:12px}
.option-card strong{display:block;margin-bottom:4px}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--bg-elevated);border-radius:999px;padding:4px 9px;font-size:11px;cursor:pointer;color:var(--text-secondary)}
.chip.active{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.gap-row{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  :root{--sidebar-w:64px}
  .brand-text,.nav-btn span,.nav-meta,.sidebar-foot,.nav-section-label{display:none}
  .nav-btn{justify-content:center;padding:9px}.sidebar-brand{justify-content:center;padding:14px 8px}
  .grid-3,.grid-2{grid-template-columns:1fr}.span-2,.span-3{grid-column:span 1}
  .decision-options{grid-template-columns:1fr}.school-select label{display:none}
  .macro-step{min-width:72px}
}
@media (max-width:700px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-md)}
  .sidebar.open{transform:translateX(0)}
  .brand-text,.nav-btn span,.nav-meta,.sidebar-foot,.nav-section-label{display:block}
  .nav-btn{justify-content:flex-start}.sidebar-brand{justify-content:flex-start;padding:14px}
  .menu-toggle{display:inline-flex}.top-actions .hide-sm{display:none}
  .gap-row{grid-template-columns:1fr}table.data{display:block;overflow-x:auto}
  .macro-step-name{font-size:10px}
  .micro-card.focus{padding:14px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="sidebar-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="currentColor" style="color:var(--accent)"/>
        <path d="M8 21V11h3.2l2.4 6.4L16 11H19v10h-2.2v-6.2L14.2 21h-2.4l-2.6-6.2V21H8zm13.2 0v-2.1h2.9V13H21V11h7.2v2h-2.9v5.9h2.9V21h-7z" fill="var(--accent-contrast)"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">Professor Roadmap</div>
        <div class="brand-sub">Career OS · Personal</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot">In-memory only · Export to save</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

        { id: "n4", title: "Course wedge idea", body: "A differentiated elective: B2B Demand Generation & Revenue Marketing — covers ICP, funnel architecture, attribution, marketing ops, and sales alignment. Strong white space vs generic principles of marketing.", tags: ["teaching", "courses"], section: "teaching", pinned: false, updated: "2026-08-01" },

  /** Map timeline phases → related workspace sections (existing IDs only). */
  const PHASE_WORKSPACE = {
    ph1: ["setonhall", "decisions", "research"],
    ph2: ["degree", "documents", "gaps"],
    ph3: ["teaching", "materials"],
    ph4: ["materials", "documents"],
    ph5: ["contacts", "research"],
    ph6: ["materials", "contacts", "setonhall"],
    ph7: ["teaching", "materials", "notes"],
  };

  let state = createInitialState();
  let currentSection = "overview";

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function flatMilestones() {
    const steps = [];
    state.timeline.forEach((phase) => {
      phase.milestones.forEach((m) => {
        steps.push({
          phaseId: phase.id,
          phaseName: phase.phase,
          phaseTarget: phase.target,
          milestone: m,
        });
      });
    });
    return steps;
  }

  /** Derive last / current / next from existing timeline milestones only. */
  function journeyContext() {
    const steps = flatMilestones();
    const firstOpen = steps.findIndex((s) => !s.milestone.done);
    const allDone = steps.length > 0 && firstOpen === -1;
    const currentIndex = allDone ? steps.length - 1 : firstOpen;
    const current = currentIndex >= 0 ? steps[currentIndex] : null;
    const prev = currentIndex > 0 ? steps[currentIndex - 1] : null;
    const next = !allDone && currentIndex >= 0 ? steps[currentIndex + 1] || null : null;
    const doneCount = steps.filter((s) => s.milestone.done).length;
    return { steps, prev, current, next, currentIndex, allDone, doneCount };
  }

  /** Keep phase status in sync with milestone completion (Completed / Current / Pending). */
  function syncTimelineFromMilestones() {
    let activated = false;
    state.timeline.forEach((phase) => {
      const total = phase.milestones.length;
      const done = phase.milestones.filter((m) => m.done).length;
      if (total > 0 && done === total) {
        phase.status = "done";
        return;
      }
      if (!activated) {
        phase.status = "active";
        activated = true;
      } else {
        phase.status = "upcoming";
      }
    });
  }

  function phaseVisualStatus(phase) {
    if (phase.status === "done") return "completed";
    if (phase.status === "active") return "active";
    return "pending";
  }

  function phaseStatusLabel(visual) {
    if (visual === "completed") return "Completed";
    if (visual === "active") return "Current";
    return "Pending";
  }

  function renderMacroTrack(opts = {}) {
    const { highlightPhaseId = null, clickable = false } = opts;
    const ctx = journeyContext();
    const pct = ctx.steps.length
      ? Math.round((ctx.doneCount / ctx.steps.length) * 100)
      : 0;
    return `
      <section class="macro-track" aria-label="Overall journey progress">
        <div class="macro-track-head">
          <div class="macro-track-label">Overall journey</div>
          <div class="macro-track-meta num">${ctx.doneCount} of ${ctx.steps.length} milestones · ${pct}%</div>
        </div>
        <div class="macro-steps" role="list">
          ${state.timeline.map((phase) => {
            const visual = phaseVisualStatus(phase);
            const doneInPhase = phase.milestones.filter((m) => m.done).length;
            const isHere = highlightPhaseId
              ? phase.id === highlightPhaseId
              : visual === "active";
            const tag = clickable ? "button" : "div";
            const clickAttrs = clickable
              ? `type="button" data-expand-phase="${phase.id}"`
              : `role="listitem"`;
            return `
              <${tag} class="macro-step ${visual}${clickable ? " clickable" : ""}" ${clickAttrs} title="${escapeHtml(phase.phase)}">
                <div class="macro-step-rail">
                  <span class="macro-step-dot" aria-hidden="true">${visual === "completed" ? "✓" : visual === "active" ? "●" : ""}</span>
                </div>
                <div class="macro-step-name">${escapeHtml(phase.phase)}</div>
                <div class="macro-step-status">${phaseStatusLabel(visual)}${isHere ? " · You are here" : ""}</div>
                <div class="macro-track-meta" style="margin-top:2px">${doneInPhase}/${phase.milestones.length} · ${escapeHtml(phase.target)}</div>
              </${tag}>`;
          }).join("")}
        </div>
      </section>`;
  }

  function relatedSectionButtons(phaseId) {
    const ids = PHASE_WORKSPACE[phaseId] || [];
    return ids
      .map((id) => {
        const s = SECTIONS.find((x) => x.id === id);
        if (!s) return "";
        return `<button class="btn btn-sm" type="button" data-nav="${s.id}">${escapeHtml(s.label)}</button>`;
      })
      .join("");
  }

  function renderMicroZone() {
    const ctx = journeyContext();
    const openActions = state.nextActions.filter((a) => !a.done).slice(0, 4);
    const anchor = ctx.prev && ctx.prev.milestone.done ? ctx.prev : null;

    let focusHtml;
    if (!ctx.current) {
      focusHtml = `
        <article class="micro-card focus" aria-label="Current action required">
          <div class="micro-kicker">Current Action Required</div>
          <div class="micro-empty">No milestones on the timeline yet.</div>
        </article>`;
    } else if (ctx.allDone) {
      focusHtml = `
        <article class="micro-card focus" aria-label="Current action required">
          <div class="micro-kicker">Current Action Required</div>
          <div class="micro-title">All roadmap milestones are complete</div>
          <div class="micro-meta">Phase: ${escapeHtml(ctx.current.phaseName)} · Target ${escapeHtml(ctx.current.phaseTarget)}</div>
          <div class="micro-body card-muted">Use the section workspaces below to keep materials, outreach, and notes current — or add new milestones on Timeline.</div>
          <div class="micro-actions">
            <button class="btn btn-primary btn-sm" type="button" data-nav="timeline">Review Timeline</button>
            <button class="btn btn-sm" type="button" data-nav="notes">Open Notes</button>
          </div>
        </article>`;
    } else {
      const cur = ctx.current;
      const siblings = state.timeline
        .find((p) => p.id === cur.phaseId)
        ?.milestones.filter((m) => !m.done && m.id !== cur.milestone.id)
        .slice(0, 3) || [];
      focusHtml = `
        <article class="micro-card focus" aria-label="Current action required">
          <div class="micro-kicker">Current Action Required: ${escapeHtml(cur.milestone.text)}</div>
          <div class="micro-title">${escapeHtml(cur.milestone.text)}</div>
          <div class="micro-meta">
            Phase: ${escapeHtml(cur.phaseName)} · Target ${escapeHtml(cur.phaseTarget)} · Status: <strong>In Progress</strong>
          </div>
          <div class="micro-body">
            <label class="list-item" style="background:var(--bg);border-color:var(--info)">
              <input class="check" type="checkbox" data-milestone="${cur.phaseId}:${cur.milestone.id}" ${cur.milestone.done ? "checked" : ""} />
              <span class="list-body">
                <div class="list-title">Mark this milestone complete</div>
                <div class="list-meta">Completing advances you to the next step in the journey.</div>
              </span>
            </label>
            <div class="field" style="margin-top:12px;margin-bottom:0">
              <label class="label">Key next decision (context)</label>
              <textarea class="textarea" data-bind="overview.keyNextDecision" aria-label="Key next decision">${escapeHtml(state.overview.keyNextDecision)}</textarea>
            </div>
            ${openActions.length ? `
              <div class="micro-checklist">
                <div class="label" style="margin:8px 0 0">Related open actions</div>
                ${openActions.map((a) => `
                  <label class="list-item" style="padding:6px 8px">
                    <input class="check" type="checkbox" data-action-check="${a.id}" ${a.done ? "checked" : ""} />
                    <span class="list-body"><div class="list-title">${escapeHtml(a.text)}</div><div class="list-meta">Due ${escapeHtml(a.due || "—")}</div></span>
                  </label>`).join("")}
              </div>` : ""}
            ${siblings.length ? `
              <div class="list-meta" style="margin-top:10px">Still in this phase after this step: ${siblings.map((m) => escapeHtml(m.text)).join(" · ")}</div>` : ""}
          </div>
          <div class="micro-actions">
            ${relatedSectionButtons(cur.phaseId)}
            <button class="btn btn-sm btn-ghost" type="button" data-nav="timeline">Full Timeline</button>
          </div>
        </article>`;
    }

    const anchorHtml = anchor
      ? `
        <article class="micro-card anchor" aria-label="Previously completed">
          <div class="micro-kicker">Previously Completed: ${escapeHtml(anchor.milestone.text)}</div>
          <div class="micro-title">${escapeHtml(anchor.milestone.text)}</div>
          <div class="micro-meta">Phase: ${escapeHtml(anchor.phaseName)} · Status: Completed</div>
        </article>`
      : `
        <article class="micro-card anchor" aria-label="Previously completed">
          <div class="micro-kicker">Previously Completed</div>
          <div class="micro-empty">No prior milestone yet — you are at the start of the journey.</div>
        </article>`;

    const foresightHtml = ctx.next
      ? `
        <article class="micro-card foresight" aria-label="Up next">
          <div class="micro-kicker">Up Next: ${escapeHtml(ctx.next.milestone.text)}</div>
          <div class="micro-title">${escapeHtml(ctx.next.milestone.text)}</div>
          <div class="micro-meta">Phase: ${escapeHtml(ctx.next.phaseName)} · Status: Pending · Unlocks after the current step</div>
        </article>`
      : `
        <article class="micro-card foresight" aria-label="Up next">
          <div class="micro-kicker">Up Next</div>
          <div class="micro-empty">${ctx.allDone ? "Nothing queued — journey milestones are complete." : "This is the final open milestone."}</div>
        </article>`;

    return `
      <section class="micro-zone" aria-label="Immediate workflow">
        ${anchorHtml}
        ${focusHtml}
        ${foresightHtml}
      </section>`;
  }

  function statusPill(status) {
    const map = {
      not_started: ["pill", "Not started"],
      exploring: ["pill pill-info", "Exploring"],
      decided: ["pill pill-success", "Decided"],
      in_progress: ["pill pill-warning", "In Progress"],
      upcoming: ["pill", "Pending"],
      active: ["pill pill-info", "Current"],
      done: ["pill pill-success", "Completed"],
      complete: ["pill pill-success", "Completed"],
      n_a: ["pill", "N/A"],
      identify: ["pill pill-warning", "Identify"],
      research: ["pill pill-info", "Research"],
      contacted: ["pill pill-accent", "Contacted"],
      meeting: ["pill pill-accent", "Meeting set"],
      nurturing: ["pill pill-info", "Nurturing"],
      closed: ["pill", "Closed"],
      open: ["pill pill-warning", "Open"],
      answered: ["pill pill-success", "Answered"],
      reviewed: ["pill", "Reviewed"],
      important: ["pill pill-danger", "Important"],
      follow_up: ["pill pill-warning", "Follow up"],
      open_question: ["pill pill-info", "Open question"],
      high: ["pill pill-danger", "High"],
      medium: ["pill pill-warning", "Medium"],
      low: ["pill", "Low"],
      High: ["pill pill-success", "High"],
    };
    const [cls, label] = map[status] || ["pill", String(status)];
    return `<span class="${cls}">${escapeHtml(label)}</span>`;
  }

  function iconSvg(name) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;
  }

  function schoolName() {
    const s = state.schools.find((x) => x.id === state.targetSchoolId);
    return s ? s.name : "Target school";
  }

  function schoolShort() {
    const s = state.schools.find((x) => x.id === state.targetSchoolId);
    return s ? s.short : "Target";
  }

  function avgReadiness() {
    const vals = Object.values(state.overview.readiness);
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }

  function openGaps() {
    return state.gaps.filter((g) => g.priority === "high");
  }

  function teachingProgress() {
    const items = state.teaching.items;
    const done = items.filter((i) => i.done || i.status === "done").length;
    return { done, total: items.length, pct: items.length ? Math.round((done / items.length) * 100) : 0 };
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function renderNav() {
    const nav = $("#nav");
    const groups = [
      { label: "Command", ids: ["overview", "decisions", "gaps"] },
      { label: "Target", ids: ["setonhall", "degree", "teaching"] },
      { label: "Execution", ids: ["materials", "documents", "research", "contacts", "timeline"] },
      { label: "Capture", ids: ["notes"] },
    ];
    nav.innerHTML = groups.map((g) => {
      const items = g.ids.map((id) => {
        const s = SECTIONS.find((x) => x.id === id);
        const active = currentSection === id ? " active" : "";
        let meta = "";
        if (id === "gaps") meta = `<span class="nav-meta">${openGaps().length}</span>`;
        if (id === "contacts") meta = `<span class="nav-meta">${state.contacts.length}</span>`;
        if (id === "notes") meta = `<span class="nav-meta">${state.notes.length}</span>`;
        if (id === "timeline" || id === "overview") {
          const ctx = journeyContext();
          meta = `<span class="nav-meta">${ctx.doneCount}/${ctx.steps.length}</span>`;
        }
        return `<button class="nav-btn${active}" data-section="${id}" type="button">${iconSvg(s.icon)}<span>${s.label}</span>${meta}</button>`;
      }).join("");
      return `<div class="nav-section-label">${g.label}</div>${items}`;
    }).join("");
  }

  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    $("#themeToggle").setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }

    ).join("");

    if (!SECTIONS.find((s) => s.id === section)) section = "overview";
    currentSection = section;
    if (pushHash) location.hash = section;
    renderNav();
    const sec = SECTIONS.find((s) => s.id === section);
    $("#pageTitle").textContent = sec.label;
    $("#pageCrumb").textContent = `Marketing Professor Roadmap · ${schoolShort()} · ${sec.label}`;
    renderView();
    $("#content").scrollTop = 0;
    closeDrawer();

    $("#sidebar").classList.add("open");

  function viewNotes() {
    const q = (state.ui.notesQuery || "").toLowerCase();
    const tag = state.ui.notesTag;
    const allTags = Array.from(new Set(state.notes.flatMap((n) => n.tags)));
    let notes = state.notes.filter((n) => {
      const hay = (n.title + " " + n.body + " " + n.tags.join(" ")).toLowerCase();
      return (!q || hay.includes(q)) && (tag === "all" || n.tags.includes(tag));
    });
    notes = [...notes].sort((a, b) => (b.pinned - a.pinned) || b.updated.localeCompare(a.updated));
    return `
      <p class="section-intro">Flexible notes workspace. Pin what matters; tag and link notes to sections.</p>
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <input class="input" id="notesQuery" value="${escapeHtml(state.ui.notesQuery)}" placeholder="Search notes..." />
        </div>
        <div class="filter-chips">
          <button class="chip ${tag === "all" ? "active" : ""}" data-notes-tag="all" type="button">All</button>
          ${allTags.map((t) => `<button class="chip ${tag === t ? "active" : ""}" data-notes-tag="${escapeHtml(t)}" type="button">${escapeHtml(t)}</button>`).join("")}
        </div>
        <div class="spacer"></div>
        <button class="btn btn-primary btn-sm" data-action="add-note" type="button">Add note</button>
      </div>
      ${notes.length === 0 ? `<div class="empty"><strong>No notes match</strong>Clear filters or capture a new note.</div>` : `
      <div class="grid grid-2">
        ${notes.map((n) => `
          <div class="card note-card ${n.pinned ? "pinned" : ""}">
            <div class="card-h">
              <div class="card-title"><input class="editable" data-note="${n.id}" data-field="title" value="${escapeHtml(n.title)}" /></div>
              <div style="display:flex;gap:6px">
                <button class="btn btn-sm btn-ghost" data-pin-note="${n.id}" type="button" aria-label="Pin note">${n.pinned ? "Pinned" : "Pin"}</button>
              </div>
            </div>
            <div class="card-b">
              <textarea class="textarea" data-note="${n.id}" data-field="body" style="min-height:100px">${escapeHtml(n.body)}</textarea>
              <div class="field-row" style="margin-top:8px">
                <div class="field" style="margin:0"><label class="label">Linked section</label>
                  <select class="select" data-note="${n.id}" data-field="section">
                    ${SECTIONS.map((s) => `<option value="${s.id}" ${n.section === s.id ? "selected" : ""}>${s.label}</option>`).join("")}
                  </select>
                </div>
                <div class="field" style="margin:0"><label class="label">Tags (comma-separated)</label>
                  <input class="input" data-note-tags="${n.id}" value="${escapeHtml(n.tags.join(", "))}" />
                </div>
              </div>
              <div class="list-meta" style="margin-top:8px">Updated ${escapeHtml(n.updated || "—")}</div>
            </div>
          </div>`).join("")}
      </div>`}`;
  }

  function renderView() {
    const map = {
      overview: viewOverview,
      decisions: viewDecisions,
      setonhall: viewSetonHall,
      degree: viewDegree,
      teaching: viewTeaching,
      materials: viewMaterials,
      documents: viewDocuments,
      research: viewResearch,
      contacts: viewContacts,
      timeline: viewTimeline,
      gaps: viewGaps,
      notes: viewNotes,
    };
    $("#view").innerHTML = (map[currentSection] || viewOverview)();
  }

  function setByPath(path, value) {
    const parts = path.split(".");
    let obj = state;
    for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    obj[parts[parts.length - 1]] = value;
  }

  function findDecision(id) { return state.decisions.find((d) => d.id === id); }
  function findMaterial(id) { return state.materials.find((m) => m.id === id); }
  function findContact(id) { return state.contacts.find((c) => c.id === id); }
  function findDoc(id) { return state.documents.find((d) => d.id === id); }
  function findNote(id) { return state.notes.find((n) => n.id === id); }
  function findGap(id) { return state.gaps.find((g) => g.id === id); }

  function openModal(title, bodyHtml, onSave) {
    $("#modalTitle").textContent = title;
    $("#modalBody").innerHTML = bodyHtml;
    $("#modalFoot").innerHTML = `
      <button class="btn" type="button" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" type="button" id="modalSave">Save</button>`;
    $("#modal").classList.add("open");
    const close = () => $("#modal").classList.remove("open");
    $("#modalCancel").onclick = close;
    $("#modalClose").onclick = close;
    $("#modalSave").onclick = () => { onSave(); close(); };
    const first = $("#modalBody").querySelector("input,textarea,select");
    if (first) first.focus();
  }

  function exportState() {
    const payload = { ...state, meta: { ...state.meta, exportedAt: new Date().toISOString() } };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `marketing-professor-roadmap-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Exported JSON");
  }

  function importState(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || data.meta?.app !== "marketing-professor-roadmap") {
          throw new Error("Unrecognized file");
        }
        state = data;
        state.ui = { ...createInitialState().ui, ...(state.ui || {}) };
        syncTimelineFromMilestones();
        setTheme(state.theme || "light");
        populateSchoolSelect();
        navigate(currentSection, false);
        toast("Import complete");
      } catch (e) {
        toast("Import failed — check JSON file");
        console.error(e);
      }
    };
    reader.readAsText(file);
  }

  function bindViewEvents() {
    const view = $("#view");

    view.addEventListener("click", (e) => {
      const nav = e.target.closest("[data-nav]");
      if (nav) { navigate(nav.getAttribute("data-nav")); return; }

      const secondary = e.target.closest("[data-toggle-secondary]");
      if (secondary) {
        state.ui.overviewSecondaryOpen = !state.ui.overviewSecondaryOpen;
        renderView();
        return;
      }

      const expandPhase = e.target.closest("[data-expand-phase]");
      if (expandPhase) {
        const id = expandPhase.getAttribute("data-expand-phase");
        state.ui.timelineExpandedPhaseId =
          state.ui.timelineExpandedPhaseId === id && currentSection === "timeline"
            ? null
            : id;
        if (currentSection !== "timeline") navigate("timeline");
        else renderView();
        return;
      }

      const acc = e.target.closest("[data-acc-toggle]");
      if (acc) {
        const id = acc.getAttribute("data-acc-toggle");
        state.ui.openDecisionId = state.ui.openDecisionId === id ? null : id;
        renderView();
        return;
      }

      const action = e.target.closest("[data-action]");
      if (action) {
        const a = action.getAttribute("data-action");
        if (a === "add-action") addActionModal();
        if (a === "add-decision") addDecisionModal();
        if (a === "add-contact") addContactModal();
        if (a === "add-document") addDocumentModal();
        if (a === "add-link") addLinkModal();
        if (a === "add-material") addMaterialModal();
        if (a === "add-teaching") addTeachingModal();
        if (a === "add-gap") addGapModal();
        if (a === "add-note") addNoteModal();
        if (a === "add-course-idea") {
          openModal("Add course idea", `<div class="field"><label class="label">Course idea</label><input class="input" id="qaIdea" /></div>`, () => {
            const v = $("#qaIdea").value.trim();
            if (v) { state.teaching.courseIdeas.push(v); renderView(); toast("Course idea added"); }
          });
        }
        return;
      }

      const pin = e.target.closest("[data-pin-note]");
      if (pin) {
        const n = findNote(pin.getAttribute("data-pin-note"));
        if (n) { n.pinned = !n.pinned; n.updated = todayISO(); renderView(); }
        return;
      }

      const chipDoc = e.target.closest("[data-docs-cat]");
      if (chipDoc) { state.ui.docsCategory = chipDoc.getAttribute("data-docs-cat"); renderView(); return; }
      const chipRes = e.target.closest("[data-research-filter]");
      if (chipRes) { state.ui.researchFilter = chipRes.getAttribute("data-research-filter"); renderView(); return; }
      const chipNote = e.target.closest("[data-notes-tag]");
      if (chipNote) { state.ui.notesTag = chipNote.getAttribute("data-notes-tag"); renderView(); return; }
    });

    view.addEventListener("change", (e) => {
      const t = e.target;

      if (t.matches("[data-action-check]")) {
        const a = state.nextActions.find((x) => x.id === t.getAttribute("data-action-check"));
        if (a) a.done = t.checked;
        if (currentSection === "overview" || currentSection === "timeline") renderView();
        return;
      }
      if (t.matches("[data-milestone]")) {
        const [pid, mid] = t.getAttribute("data-milestone").split(":");
        const phase = state.timeline.find((p) => p.id === pid);
        const m = phase?.milestones.find((x) => x.id === mid);
        if (!m) return;
        const wasDone = m.done;
        m.done = t.checked;
        syncTimelineFromMilestones();
        const active = state.timeline.find((p) => p.status === "active");
        if (active) state.ui.timelineExpandedPhaseId = active.id;
        renderView();
        renderNav();
        if (m.done && !wasDone) {
          const ctx = journeyContext();
          if (ctx.allDone) toast("All journey milestones completed");
          else if (ctx.current) toast(`Current action: ${ctx.current.milestone.text}`);
          else toast("Milestone completed");
        } else if (!m.done && wasDone) {
          toast("Milestone reopened — journey updated");
        }
        return;
      }
      if (t.matches("[data-readiness]")) {
        state.overview.readiness[t.getAttribute("data-readiness")] = Number(t.value);
        renderView();
        return;
      }
      if (t.matches("[data-dec]")) {
        const d = findDecision(t.getAttribute("data-dec"));
        if (d) d[t.getAttribute("data-field")] = t.value;
        if (t.getAttribute("data-field") === "status" || t.getAttribute("data-field") === "leaning") renderNav();
        return;
      }
      if (t.matches("[data-sh-q]")) {
        const q = state.setonHall.openQuestions.find((x) => x.id === t.getAttribute("data-sh-q"));
        if (q) q.status = t.value;
        return;
      }
      if (t.matches("[data-degree-status]")) { state.degree.decisionStatus = t.value; return; }
      if (t.matches("[data-teach-check]")) {
        const item = state.teaching.items.find((x) => x.id === t.getAttribute("data-teach-check"));
        if (item) { item.done = t.checked; if (t.checked) item.status = "done"; renderView(); }
        return;
      }
      if (t.matches("[data-teach-status]")) {
        const item = state.teaching.items.find((x) => x.id === t.getAttribute("data-teach-status"));
        if (item) { item.status = t.value; item.done = t.value === "done"; renderView(); }
        return;
      }
      if (t.matches("[data-mat]")) {
        const m = findMaterial(t.getAttribute("data-mat"));
        if (m) m[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-doc]")) {
        const d = findDoc(t.getAttribute("data-doc"));
        if (d) {
          d[t.getAttribute("data-field")] = t.value;
          if (t.getAttribute("data-field") === "url" && t.value.trim()) d.needsUpload = false;
        }
        return;
      }
      if (t.matches("[data-doc-upload]")) {
        const d = findDoc(t.getAttribute("data-doc-upload"));
        if (d) d.needsUpload = t.checked;
        return;
      }
      if (t.matches("[data-link-status]")) {
        const r = state.research.find((x) => x.id === t.getAttribute("data-link-status"));
        if (r) r.status = t.value;
        return;
      }
      if (t.matches("[data-contact]")) {
        const c = findContact(t.getAttribute("data-contact"));
        if (c) c[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-phase-status]")) {
        const p = state.timeline.find((x) => x.id === t.getAttribute("data-phase-status"));
        if (p) { p.status = t.value; renderView(); }
        return;
      }
      if (t.matches("[data-gap]")) {
        const g = findGap(t.getAttribute("data-gap"));
        if (g) { g[t.getAttribute("data-field")] = t.value; if (t.getAttribute("data-field") === "priority") renderNav(); }
        return;
      }
      if (t.matches("[data-note]") && t.tagName === "SELECT") {
        const n = findNote(t.getAttribute("data-note"));
        if (n) { n[t.getAttribute("data-field")] = t.value; n.updated = todayISO(); }
        return;
      }
    });

    view.addEventListener("input", (e) => {
      const t = e.target;
      if (t.matches("[data-bind]")) { setByPath(t.getAttribute("data-bind"), t.value); return; }
      if (t.matches("[data-dec]")) {
        const d = findDecision(t.getAttribute("data-dec"));
        if (d) d[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-sh]")) { state.setonHall[t.getAttribute("data-sh")] = t.value; return; }
      if (t.matches("[data-sh-fit]")) { state.setonHall.fit[t.getAttribute("data-sh-fit")] = t.value; return; }
      if (t.matches("[data-course-notes]")) {
        const c = state.setonHall.courses.find((x) => x.id === t.getAttribute("data-course-notes"));
        if (c) c.notes = t.value;
        return;
      }
      if (t.matches("[data-degree]")) { state.degree[t.getAttribute("data-degree")] = t.value; return; }
      if (t.matches("[data-deg-notes]")) {
        const row = state.degree.underConsideration.find((x) => x.id === t.getAttribute("data-deg-notes"));
        if (row) row.notes = t.value;
        return;
      }
      if (t.matches("[data-mat]")) {
        const m = findMaterial(t.getAttribute("data-mat"));
        if (m) m[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-doc]")) {
        const d = findDoc(t.getAttribute("data-doc"));
        if (d) d[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-link-notes]")) {
        const r = state.research.find((x) => x.id === t.getAttribute("data-link-notes"));
        if (r) r.notes = t.value;
        return;
      }
      if (t.matches("[data-contact]")) {
        const c = findContact(t.getAttribute("data-contact"));
        if (c) c[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-phase-target]")) {
        const p = state.timeline.find((x) => x.id === t.getAttribute("data-phase-target"));
        if (p) p.target = t.value;
        return;
      }
      if (t.matches("[data-gap]")) {
        const g = findGap(t.getAttribute("data-gap"));
        if (g) g[t.getAttribute("data-field")] = t.value;
        return;
      }
      if (t.matches("[data-note]")) {
        const n = findNote(t.getAttribute("data-note"));
        if (n) { n[t.getAttribute("data-field")] = t.value; n.updated = todayISO(); }
        return;
      }
      if (t.matches("[data-note-tags]")) {
        const n = findNote(t.getAttribute("data-note-tags"));
        if (n) { n.tags = t.value.split(",").map((x) => x.trim()).filter(Boolean); n.updated = todayISO(); }
        return;
      }
      if (t.id === "researchQuery") {
        state.ui.researchQuery = t.value;
        clearTimeout(bindViewEvents._rq);
        bindViewEvents._rq = setTimeout(() => renderView(), 180);
        return;
      }
      if (t.id === "notesQuery") {
        state.ui.notesQuery = t.value;
        clearTimeout(bindViewEvents._nq);
        bindViewEvents._nq = setTimeout(() => renderView(), 180);
      }
    });
  }

  function boot() {
    // When opened as a top-level page, bounce into the JasonOS-wrapped route
    // so the main nav is present. Skip when embedded in the app iframe.
    if (window.self === window.top && !location.protocol.startsWith("file")) {
      const target = "/projects/professor-roadmap";
      if (location.pathname !== target) {
        location.replace(target + (location.hash || ""));
        return;
      }
    }

    // Prefer system theme on first load only for comfort; still in-memory
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      state.theme = "dark";
    }
    setTheme(state.theme);
    populateSchoolSelect();
    syncTimelineFromMilestones();
    renderNav();
    bindViewEvents();

    $("#nav").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-section]");
      if (btn) navigate(btn.getAttribute("data-section"));
    });

    $("#themeToggle").addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));
    $("#exportBtn").addEventListener("click", exportState);
    $("#importBtn").addEventListener("click", () => $("#importFile").click());
    $("#importFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) importState(file);
      e.target.value = "";
    });
    $("#quickAddBtn").addEventListener("click", quickAddForSection);
    $("#targetSchool").addEventListener("change", (e) => {
      state.targetSchoolId = e.target.value;
      $("#pageCrumb").textContent = `Marketing Professor Roadmap · ${schoolShort()} · ${SECTIONS.find((s) => s.id === currentSection).label}`;
      if (currentSection === "overview" || currentSection === "setonhall") renderView();
    });
    $("#menuToggle").addEventListener("click", openDrawer);
    $("#drawerBackdrop").addEventListener("click", closeDrawer);
    $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("#modal").classList.remove("open"); });

    window.addEventListener("hashchange", () => {
      const h = location.hash.replace("#", "") || "overview";
      if (h !== currentSection) navigate(h, false);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        $("#modal").classList.remove("open");
        closeDrawer();
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        quickAddForSection();
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "e") {
        e.preventDefault();
        exportState();
      }
    });

    const initial = location.hash.replace("#", "") || "overview";
    navigate(initial, false);
  }

  boot();
})();
</script>
</body>
</html>
